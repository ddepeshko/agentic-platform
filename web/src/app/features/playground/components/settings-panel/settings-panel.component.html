<mat-slide-toggle [formField]="settingsForm.useTools">Передавати тули моделі</mat-slide-toggle>

@if (context.tools().length > 0) {
  <mat-chip-set>
    @for (tool of context.tools(); track tool.function.name) {
      <mat-chip>
        <mat-icon matChipAvatar>build</mat-icon>
        {{ tool.function.name }}
      </mat-chip>
    }
  </mat-chip-set>
}
