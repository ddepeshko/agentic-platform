<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-subtitle>{{ message().role }} · messages[{{ index() }}]</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (reasoning()) {
      <mat-expansion-panel class="reasoning">
        <mat-expansion-panel-header>
          <mat-panel-title>Роздуми моделі (reasoning)</mat-panel-title>
        </mat-expansion-panel-header>
        <p>{{ reasoning() }}</p>
      </mat-expansion-panel>
    }

    @if (message().content) {
      <p class="text">{{ message().content }}</p>
    }

    @for (call of toolCalls(); track call.id) {
      <div class="tool-call">
        <mat-chip-set>
          <mat-chip>
            <mat-icon matChipAvatar>build</mat-icon>
            {{ call.function.name }}
          </mat-chip>
        </mat-chip-set>
        <pre>{{ call.function.arguments }}</pre>
      </div>
    }
  </mat-card-content>
</mat-card>
